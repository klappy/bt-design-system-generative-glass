<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=390">
<title>Icon preview</title>
<!-- 390x844 preview of every Icon glyph, read straight from Icon.jsx (not _ds_bundle.js, which is compiled upstream; DEPLOY.md:13).
     ?theme=dark sets data-theme="dark". FIA v2 additions are outlined in the grid. Screenshots: icons.preview-light.png, icons.preview-dark.png. -->
<link rel="stylesheet" href="../../styles.css">
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<style>*{box-sizing:border-box}html,body{margin:0}body{font-family:var(--font-core);background:var(--aurora-field);-webkit-font-smoothing:antialiased;min-height:844px;color:var(--text-title)}
#root{width:390px;padding:20px 16px}h1{font-size:17px;margin:0 0 4px}p{font-size:12px;margin:0 0 14px;color:var(--text-muted)}
.g{display:grid;grid-template-columns:repeat(5,1fr);gap:10px 6px}.c{display:grid;gap:5px;justify-items:center;padding:8px 0;border-radius:12px}
.c.new{outline:1px dashed var(--text-dim)}.c span{font:9px var(--font-mono);color:var(--text-muted)}</style>
<script>if(new URLSearchParams(location.search).get('theme')==='dark')document.documentElement.setAttribute('data-theme','dark');</script>
</head><body><div id="root"></div>
<script>
(async()=>{
  let src=await (await fetch('Icon.jsx')).text();
  src=src.replace(/^import\s+React.*$/m,'').replace(/^export\s+/mg,'');
  const NS={};new Function('React','NS',Babel.transform(src+'\n;Object.assign(NS,{Icon,iconNames});',{presets:['react']}).code)(React,NS);
  const NEW='play pause download image chevronDown share warning update chat list settings message tag info ellipsis map video'.split(' ');
  const h=React.createElement, dark=document.documentElement.dataset.theme==='dark';
  ReactDOM.createRoot(document.getElementById('root')).render(h('div',null,
    h('h1',null,'Icon — '+NS.iconNames.length+' glyphs ('+(dark?'dark':'light')+')'),
    h('p',null,'Dashed: the 17 FIA alpha v2 additions (K1). Size 22, stroke 1.7.'),
    h('div',{className:'g'},NS.iconNames.map(n=>h('div',{key:n,className:'c'+(NEW.includes(n)?' new':''),'data-icon':n},h(NS.Icon,{name:n,size:22}),h('span',null,n))))));
  document.body.dataset.ready='1';
})();
</script></body></html>
