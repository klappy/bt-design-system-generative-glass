<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>*{box-sizing:border-box;margin:0}body{font-family:var(--font-core);background:var(--studio-bg);padding:20px;color:var(--text-title);-webkit-font-smoothing:antialiased;height:140px}.row{display:flex;gap:10px;align-items:flex-end;flex-wrap:wrap}.sw{border-radius:10px;height:56px;flex:1;min-width:0;box-shadow:var(--shadow-rest)}.lb{font:var(--fw-medium) 9px/1.3 var(--font-core);color:var(--text-muted);margin-top:6px;letter-spacing:.02em}.hx{font:var(--fw-regular) 9px/1.3 var(--font-mono);color:var(--text-dim)}.g{border-radius:var(--r-xl);background:var(--glass-fill-2);backdrop-filter:blur(var(--blur-medium)) var(--sat-glass);-webkit-backdrop-filter:blur(var(--blur-medium)) var(--sat-glass);border:var(--border-glass);box-shadow:var(--shadow-card),var(--inner-top),var(--inner-edge)}.ov{font:var(--type-overline);letter-spacing:var(--ls-overline);text-transform:uppercase;color:var(--text-muted)}</style></head><body><div class="row"><div style="flex:1;min-width:0"><div class="sw" style="background:var(--accent-blue)"></div><div class="lb">--accent-blue</div><div class="hx">#1F4FE0 · links, badge</div></div><div style="flex:1;min-width:0"><div class="sw" style="background:var(--accent-red)"></div><div class="lb">--accent-red</div><div class="hx">#D0202E · avatar ring, active pin</div></div><div style="flex:1;min-width:0"><div class="sw" style="background:var(--accent-teal)"></div><div class="lb">--accent-teal</div><div class="hx">#3FB6A8 · up to date</div></div><div style="flex:1;min-width:0"><div class="sw" style="background:transparent;border:1px dashed var(--text-dim);display:grid;place-items:center;font:var(--fw-medium) 10px var(--font-core);color:var(--text-muted)">no fourth</div><div class="lb">status = tint + shape</div></div></div></body></html>
