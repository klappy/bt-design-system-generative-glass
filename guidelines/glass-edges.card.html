<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>*{box-sizing:border-box;margin:0}body{font-family:var(--font-core);background:var(--aurora-field);padding:20px;color:var(--text-title);-webkit-font-smoothing:antialiased;height:180px}.row{display:flex;gap:10px;align-items:flex-end;flex-wrap:wrap}.sw{border-radius:10px;height:56px;flex:1;min-width:0;box-shadow:var(--shadow-rest)}.lb{font:var(--fw-medium) 9px/1.3 var(--font-core);color:var(--text-muted);margin-top:6px;letter-spacing:.02em}.hx{font:var(--fw-regular) 9px/1.3 var(--font-mono);color:var(--text-dim)}.g{border-radius:var(--r-xl);background:var(--glass-fill-2);backdrop-filter:blur(var(--blur-medium)) var(--sat-glass);-webkit-backdrop-filter:blur(var(--blur-medium)) var(--sat-glass);border:var(--border-glass);box-shadow:var(--shadow-card),var(--inner-top),var(--inner-edge)}.ov{font:var(--type-overline);letter-spacing:var(--ls-overline);text-transform:uppercase;color:var(--text-muted)}</style></head><body><div style="display:flex;gap:12px"><div style="flex:1;height:110px;border-radius:var(--r-xl);background:var(--glass-fill-2);border:var(--border-glass);display:grid;place-items:center;font:var(--fw-medium) 11px var(--font-core)">--border-glass</div><div style="flex:1;height:110px;border-radius:var(--r-xl);background:var(--glass-fill-2);box-shadow:var(--inner-top);display:grid;place-items:center;font:var(--fw-medium) 11px var(--font-core)">--inner-top</div><div style="flex:1;height:110px;border-radius:var(--r-xl);background:var(--glass-fill-2);position:relative;overflow:hidden;display:grid;place-items:center;font:var(--fw-medium) 11px var(--font-core)"><span style="position:absolute;inset:0;background:var(--refraction)"></span><span style="position:relative">--refraction</span></div><div class="g" style="flex:1;height:110px;display:grid;place-items:center;font:var(--fw-medium) 11px var(--font-core)">all three</div></div></body></html>
