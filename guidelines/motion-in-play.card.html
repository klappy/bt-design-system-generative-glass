<!-- @dsCard group="Motion" viewport="700x210" name="Motion in play" subtitle="rise, float, breathe, draw; resolving a thread softens it" -->
<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>*{box-sizing:border-box;margin:0}body{font-family:var(--font-core);background:var(--aurora-field);padding:20px;color:var(--text-title);-webkit-font-smoothing:antialiased;height:210px}.row{display:flex;gap:10px;align-items:flex-end;flex-wrap:wrap}.sw{border-radius:10px;height:56px;flex:1;min-width:0;box-shadow:var(--shadow-rest)}.lb{font:var(--fw-medium) 9px/1.3 var(--font-core);color:var(--text-muted);margin-top:6px;letter-spacing:.02em}.hx{font:var(--fw-regular) 9px/1.3 var(--font-mono);color:var(--text-dim)}.g{border-radius:var(--r-xl);background:var(--glass-fill-2);backdrop-filter:blur(var(--blur-medium)) var(--sat-glass);-webkit-backdrop-filter:blur(var(--blur-medium)) var(--sat-glass);border:var(--border-glass);box-shadow:var(--shadow-card),var(--inner-top),var(--inner-edge)}.ov{font:var(--type-overline);letter-spacing:var(--ls-overline);text-transform:uppercase;color:var(--text-muted)}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;height:100%}.cell{display:grid;grid-template-rows:1fr auto auto;gap:6px;justify-items:center;align-items:center}.card{width:92px;height:64px;border-radius:var(--r-lg);background:var(--glass-fill-2);backdrop-filter:blur(var(--blur-strong)) var(--sat-glass);border:var(--border-glass);box-shadow:var(--shadow-card),var(--inner-top)}.rise{animation:gg-rise var(--dur-morph) var(--ease-liquid) infinite alternate}.float{animation:gg-float var(--float-cycle) var(--ease-liquid) infinite}.ring{width:64px;height:64px;border-radius:50%;border:1.5px dotted rgba(20,28,45,.35);animation:gg-breathe 4.5s var(--ease-liquid) infinite}.soft{animation:ggsoft 3s var(--ease-liquid) infinite alternate}@keyframes ggsoft{to{opacity:.62;filter:saturate(.8)}}</style></head><body><div class="grid"><div class="cell"><div class="card rise"></div><div class="lb">gg-rise</div><div class="hx">1100ms · liquid</div></div><div class="cell"><div class="card float"></div><div class="lb">gg-float</div><div class="hx">6s loop</div></div><div class="cell"><div class="ring"></div><div class="lb">gg-breathe</div><div class="hx">4.5s · sync, loading</div></div><div class="cell"><div class="card soft" style="display:grid;place-items:center;font:var(--type-overline);letter-spacing:var(--ls-overline);text-transform:uppercase;color:var(--text-muted)">Resolved</div><div class="lb">resolve softens</div><div class="hx">opacity .62 · saturate .8</div></div></div></body></html>
